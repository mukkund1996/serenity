name: release

# release-please keeps a release PR open from conventional commits on main.
# Merging it tags vX.Y.Z and creates the GitHub release; the jobs below then
# attach the binaries and their checksums and bump the Homebrew tap (ADR 0014).
#
# Nothing here runs for a commit until ci has passed on it (ADR 0068): this
# workflow starts when ci completes on main, and the gate job lets it go on
# only for a push whose ci succeeded and that is still main's head. A red main
# never bumps the release PR, tags, builds or touches the tap.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build binaries for, e.g. v0.5.0 (needs a passing ci run on its commit)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatches ci on the release PR, install-smoke and website

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ inputs.tag }}
        run: scripts/release-gate.sh >>"$GITHUB_OUTPUT"

  release-please:
    needs: gate
    if: github.event_name == 'workflow_run' && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
      # release-please pushes its PR with GITHUB_TOKEN, which fires no
      # pull_request event, so ci is dispatched on the PR's branch instead.
      # Its checks land on the PR's head commit like any PR's. Idempotent: it
      # dispatches only when that commit has no ci run yet.
      - name: Run ci on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --label "autorelease: pending" --state open --json headRefName,headRefOid --jq '.[0] // empty')
          if [ -z "$pr" ]; then echo "no open release PR"; exit 0; fi
          branch=$(printf '%s' "$pr" | jq -r .headRefName)
          sha=$(printf '%s' "$pr" | jq -r .headRefOid)
          # A pull_request run waiting for approval (action_required) never runs, so it does not count.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha" --jq '[.workflow_runs[] | select(.conclusion != "action_required")] | length')
          if [ "$runs" -gt 0 ]; then echo "ci already ran on $branch at $sha"; exit 0; fi
          gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$branch"
          echo "dispatched ci on $branch at $sha"

  build:
    needs: [gate, release-please]
    if: always() && needs.gate.outputs.go == 'true' && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest, native: true }
          - { target: darwin-x64, os: macos-latest }
          - { target: linux-x64, os: ubuntu-latest, native: true }
          - { target: linux-arm64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts bun-${{ matrix.target }} dist/serenity-${{ matrix.target }}
      # Apple Silicon refuses to run an unsigned binary; an ad-hoc signature is enough outside the App Store.
      - if: runner.os == 'macOS'
        run: codesign --force --sign - dist/serenity-${{ matrix.target }}
      - if: matrix.native
        run: |
          out=$(./dist/serenity-${{ matrix.target }} version)
          echo "$out"
          case "$out" in "${TAG#v}+"*) ;; *) echo "version $out does not match $TAG"; exit 1 ;; esac
      - uses: actions/upload-artifact@v4
        with:
          name: serenity-${{ matrix.target }}
          path: dist/serenity-${{ matrix.target }}

  publish:
    needs: [release-please, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum serenity-* > SHA256SUMS && cat SHA256SUMS
      - name: Upload to the release
        run: gh release upload "$TAG" assets/* --clobber
      - name: Bump the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the tap was not bumped"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mukkund1996/homebrew-tap.git" tap
          mkdir -p tap/Formula
          bun scripts/homebrew-formula.ts "$TAG" assets/SHA256SUMS > tap/Formula/serenity.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/serenity.rb
          git diff --cached --quiet || git commit -m "serenity ${TAG#v}"
          git push
      # A release created with GITHUB_TOKEN fires no `release` event, so the
      # install smoke test (from mirrored artifacts, ADR 0056) and the website
      # are dispatched here, once the binaries and the tap are in place.
      - name: Smoke-test the install and refresh the website
        run: |
          gh workflow run install-smoke.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
          gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main
