name: website

# Deploys website/ to GitHub Pages (getserenity.dev) with the latest release's
# tag written into the page (ADR 0029). It runs once per reason (ADR 0068):
# a push to main that changes website/, or a dispatch from release.yml's
# publish job after a release (a release made with GITHUB_TOKEN fires no
# `release` event). It used to also run after every release workflow run, so
# a website push deployed the same commit twice, and the second Pages
# deployment could still be in progress when the next commit's deploy began.

on:
  push:
    branches: [main]
    paths: [website/**, .github/workflows/website.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # A newer run supersedes an older one's build: only the latest page matters.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write the latest release into the page
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$tag" ]; then
            tag="v$(jq -r '.["."]' .release-please-manifest.json)"
            echo "no published release found, using the manifest: $tag"
          fi
          echo "version: $tag"
          mkdir _site
          cp -R website/. _site/
          find _site -name '*.html' -exec sed -i "s/__SERENITY_VERSION__/$tag/g" {} +
          if grep -rl --include='*.html' __SERENITY_VERSION__ _site; then echo "version placeholder left in the pages above"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # A deploy is never cancelled midway: that can leave a Pages deployment
    # "in progress" and block the next one. Runs queue here instead.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # Pages refuses a deployment while an earlier one is still finishing
      # ("due to in progress deployment"); wait for it once and try again.
      - if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::the Pages deployment failed; retrying once in 60s"
          sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
